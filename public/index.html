<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One-High</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&family=Outfit:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ═══════════════════════ LOBBY ═══════════════════════ -->
<div id="lobby-screen" class="screen active">
  <div class="lobby-wrap">
    <div class="lobby-header">
      <h1 class="game-title">ONE<br/><span>HIGH</span></h1>
      <p class="subtitle">A family trick-taking game · 4 players · 2 teams</p>
    </div>
    <div class="join-form">
      <input id="name-input" type="text" placeholder="Your name" maxlength="20" autocomplete="off" />
      <button id="join-btn" class="btn-primary">Join Game</button>
    </div>
    <div class="seats-panel">
      <h3>Waiting for players…</h3>
      <div class="seats">
        <div class="seat-row">
          <div class="seat team-a" id="seat-0"><span class="seat-label">Seat 1</span><span class="seat-name">—</span></div>
          <div class="seat team-b" id="seat-1"><span class="seat-label">Seat 2</span><span class="seat-name">—</span></div>
        </div>
        <div class="seat-row">
          <div class="seat team-a" id="seat-2"><span class="seat-label">Seat 3</span><span class="seat-name">—</span></div>
          <div class="seat team-b" id="seat-3"><span class="seat-label">Seat 4</span><span class="seat-name">—</span></div>
        </div>
      </div>
      <p class="team-note">Seats 1 &amp; 3 = Team A &nbsp;·&nbsp; Seats 2 &amp; 4 = Team B</p>
    </div>

    <!-- Seat popover — shown when clicking a filled seat -->
    <div id="seat-popover" class="seat-popover hidden">
      <p class="seat-popover-name" id="seat-popover-name"></p>
      <button class="seat-popover-btn seat-popover-remove" id="seat-popover-remove">Remove player</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════ GAME ═══════════════════════ -->
<div id="game-screen" class="screen">

  <!-- Score bar -->
  <header class="scorebar">
    <div class="score-team team-a-score">
      <span class="score-label" id="label-a">TEAM A</span>
      <span class="score-val" id="score-a">0</span>
      <span class="score-divider"></span>
      <span class="score-round" id="round-score-a">—</span>
    </div>
    <div class="game-info-center">
      <button class="settings-btn" id="settings-btn" title="Settings">⚙ Settings</button>
    </div>
    <div class="score-team team-b-score">
      <span class="score-round" id="round-score-b">—</span>
      <span class="score-divider"></span>
      <span class="score-val" id="score-b">0</span>
      <span class="score-label" id="label-b">TEAM B</span>
    </div>
  </header>

  <!-- Settings panel — slides down from scorebar -->
  <div id="settings-panel" class="settings-panel hidden">
    <div class="settings-body">
      <div class="settings-row">
        <span class="settings-label">Card order</span>
        <div class="sort-group">
          <button class="sort-btn active" id="sort-num-asc">2→A</button>
          <button class="sort-btn" id="sort-num-desc">A→2</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">Suit order</span>
        <div class="sort-group">
          <button class="sort-btn active" id="sort-suit-asc">Fewest first</button>
          <button class="sort-btn" id="sort-suit-desc">Most first</button>
        </div>
      </div>
      <div class="settings-row settings-row-end settings-undo-row" id="undo-row" style="display:none">
        <button class="btn-undo" id="undo-btn">Undo Last Play</button>
      </div>
      <div class="settings-row settings-row-end">
        <button class="btn-end-game" id="reset-btn">End Game</button>
      </div>
    </div>
  </div>

  <!-- Trick piles — positioned in top corners via CSS -->
  <div class="trick-pile trick-pile-a empty" id="trick-pile-a">
    <div class="trick-pile-deck">
      <div class="trick-pile-card"></div>
      <div class="trick-pile-card"></div>
      <div class="trick-pile-card"></div>
    </div>
    <div class="trick-pile-badge" id="trick-pile-badge-a">0</div>
  </div>
  <div class="trick-pile trick-pile-b empty" id="trick-pile-b">
    <div class="trick-pile-deck">
      <div class="trick-pile-card"></div>
      <div class="trick-pile-card"></div>
      <div class="trick-pile-card"></div>
    </div>
    <div class="trick-pile-badge" id="trick-pile-badge-b">0</div>
  </div>
  <!-- Table: opponents + center + your hand -->
  <main class="table-area">

    <!-- Opponent (across) -->
    <div class="player-zone across-zone">
      <div class="player-info">
        <span class="player-name" id="across-name">—</span>
        <span class="player-tag" id="across-tag"></span>
        <span class="bid-tag hidden" id="across-bid"></span>
      </div>
      <div class="opponent-hand" id="across-hand"></div>
    </div>

    <!-- Left opponent -->
    <div class="player-zone left-zone">
      <div class="player-info">
        <span class="player-name" id="left-name">—</span>
        <span class="player-tag" id="left-tag"></span>
        <span class="bid-tag hidden" id="left-bid"></span>
      </div>
      <div class="opponent-hand vertical" id="left-hand"></div>
    </div>

    <!-- Center play area — trick cards + action panel lives here -->
    <div class="center-area">
      <div class="trump-indicator" id="trump-indicator"></div>

      <!-- Holding piles — face-up cards sit here after trick, before flying to fixed pile -->
      <div class="trick-holding trick-holding-a hidden" id="trick-holding-a"></div>
      <div class="trick-holding trick-holding-b hidden" id="trick-holding-b"></div>

      <div class="trick-area" id="trick-area">
        <div class="trick-slot" id="trick-across"></div>
        <div class="trick-row">
          <div class="trick-slot" id="trick-left"></div>
          <div class="trick-slot trick-slot-empty"></div>
          <div class="trick-slot" id="trick-right"></div>
        </div>
        <div class="trick-slot" id="trick-self"></div>
      </div>

      <!-- Kitty card display — shown during kitty phase -->
      <div id="kitty-display" class="kitty-display hidden"></div>

      <!-- Action panel now lives in the center, not at the bottom -->
      <div class="action-panel" id="action-panel">

        <!-- Bidding controls -->
        <div class="action-section" id="bid-controls" style="display:none">
          <!-- Bid history — all 4 players -->
          <div class="bid-history" id="bid-history"></div>
          <!-- Current high bid callout -->
          <div class="bid-current" id="bid-current"></div>
          <!-- Your turn controls -->
          <div class="bid-row" id="bid-input-row">
            <button class="btn-sm" id="bid-minus">−5</button>
            <span class="bid-amount" id="bid-amount">75</span>
            <button class="btn-sm" id="bid-plus">+5</button>
          </div>
          <div class="bid-row">
            <button class="btn-primary" id="bid-submit">Bid</button>
            <button class="btn-ghost" id="bid-pass">Pass</button>
            <button class="btn-ghost" id="redeal-btn">Redeal?</button>
          </div>
          <p id="bid-waiting-msg" class="bid-waiting-msg" style="display:none"></p>
        </div>

        <!-- Kitty / trump controls -->
        <div class="action-section" id="kitty-controls" style="display:none">
          <p class="kitty-instruction">Select a card from your hand to discard, then choose trump:</p>
          <div class="trump-row" id="trump-buttons">
            <button class="trump-btn suit-red" data-suit="Red">Red</button>
            <button class="trump-btn suit-black" data-suit="Black">Black</button>
            <button class="trump-btn suit-yellow" data-suit="Yellow">Yellow</button>
            <button class="trump-btn suit-green" data-suit="Green">Green</button>
            <button class="trump-btn no-trump" data-suit="NoTrump">No Trump</button>
          </div>
        </div>

        <!-- Status message -->
        <div class="action-section" id="status-msg">
          <p id="status-text">Waiting…</p>
        </div>

      </div>
    </div>

    <!-- Right opponent -->
    <div class="player-zone right-zone">
      <div class="player-info">
        <span class="player-name" id="right-name">—</span>
        <span class="player-tag" id="right-tag"></span>
        <span class="bid-tag hidden" id="right-bid"></span>
      </div>
      <div class="opponent-hand vertical" id="right-hand"></div>
    </div>

    <!-- Your hand — spans full width at the bottom of the grid -->
    <div class="player-zone self-zone">
      <div class="self-header">
        <div class="player-info self-info">
          <span class="player-name" id="self-name">You</span>
          <span class="player-tag" id="self-tag"></span>
          <span class="bid-tag hidden" id="self-bid"></span>
        </div>
      </div>
      <div class="hand-scroll">
        <div class="hand" id="my-hand"></div>
      </div>
    </div>

  </main>

</div>

<!-- ═══════════════════════ OVERLAY ═══════════════════════ -->
<div id="overlay" class="overlay hidden">
  <div class="overlay-card">
    <h2 id="overlay-title"></h2>
    <div id="overlay-body"></div>
    <div class="overlay-btns">
      <button class="btn-primary" id="overlay-btn" style="display:none"></button>
      <button class="btn-ghost" id="overlay-cancel" style="display:none">Cancel</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<script src="/js/client.js"></script>
</body>
</html>
